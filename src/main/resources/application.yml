server:
  port: 8080
spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:h2:file:./data/prism
    username: sa
    password:
  sql:
    init:
      mode: always
prism:
  provider:
    mode: ${PRISM_PROVIDER_MODE:auto}
  openrouter:
    base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
    fast-model: ${OPENROUTER_FAST_MODEL:openai/gpt-4o-mini}
    smart-model: ${OPENROUTER_SMART_MODEL:openai/gpt-4o}
    timeout-seconds: ${OPENROUTER_TIMEOUT_SECONDS:60}
    referer: ${OPENROUTER_HTTP_REFERER:http://localhost:8080}
    app-title: Prism LLM Gateway
  budget:
    unpriced-reservation-usd: ${PRISM_UNPRICED_RESERVATION_USD:0.02}
